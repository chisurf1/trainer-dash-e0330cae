<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Douglas — Daily</title><style>
:root{--bg:#0f1220;--card:#181c30;--t:#e8e9f3;--m:#9aa0bd;--a:#f5b942;--g:#3ccf8e;--r:#e5566b;--b:#5b8cff;--c2:#23284a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t);color-scheme:dark}a{color:var(--a)}
main{max-width:720px;margin:auto;padding:16px}h1{font-size:1.4rem;margin:20px 0 4px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}h2{font-size:1rem;margin:0 0 10px;color:var(--m);text-transform:uppercase;letter-spacing:.05em}
#ch{font-size:1.05rem;line-height:1.5}b{color:var(--t)}
.note{font-size:.85rem;color:var(--a);background:#2c2a3a;border-left:3px solid var(--a);padding:6px 10px;border-radius:8px;margin-top:10px}label{display:block;padding:7px 0}
.skip{text-decoration:line-through;color:var(--m)}input[type=checkbox]{accent-color:var(--a);width:18px;height:18px;vertical-align:middle}
.btns button{margin:4px 4px 0 0;padding:8px 14px;border:0;border-radius:8px;background:var(--c2);color:var(--t);font-size:.95rem}
.btns button.sel{background:var(--a);color:#1a1205;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.strip div{text-align:center;font-size:.75rem;padding:7px 0;border-radius:8px;background:var(--c2);color:var(--m)}
.on,.hi{background:var(--g)!important;color:#06210f!important;font-weight:700}.off,.lo{background:var(--r)!important;color:#fff!important;font-weight:700}.fast{background:var(--b)!important;color:#fff!important;font-weight:700}.md{background:var(--a)!important;color:#1a1205!important;font-weight:700}
.w{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.w div{text-align:center;background:var(--c2);border-radius:14px;padding:12px;color:var(--m);font-size:.8rem}.big{font-size:1.6rem;font-weight:700;color:var(--a)}
.cd{font-size:1.6rem;font-weight:800;color:var(--a)}ul{padding-left:18px;margin:6px 0}li{margin:4px 0}
.drops{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;width:100%}.drops button{background:none;border:0;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.drops svg{width:100%;max-width:56px;height:auto;display:block;margin:0 auto}.drops path{fill:transparent;stroke:#5b8cff;stroke-width:2;opacity:.55;transition:all .15s}.drops button.f path{fill:#4aa3ff;stroke:#8fc6ff;opacity:1}
.score{font-size:3rem;font-weight:800;line-height:1;color:var(--a)}.bd{font-size:.85rem;color:var(--m);margin:8px 0}
</style></head><body><main>
<h1 id="hd">Daily dashboard</h1>
<div class="card"><h2>📊 Day score</h2><div class="score" id="sc">0</div>
<div class="bd" id="sb"></div><div class="strip" id="sstrip"></div></div>
<div class="card"><h2>🏃 Today's challenge</h2><div id="ch"></div><div class="note" id="cons"></div><div id="items"></div><div class="strip" id="wstrip"></div></div>
<div class="card"><h2>💊 Stack</h2><div id="stack"></div><a href="https://docs.google.com/document/d/1XhboshjdONUazegmiR3m3Ksoxgf-T5Oj0ymYBpSIoL8/edit" target="_blank">Health's stack doc ↗</a></div>
<div class="card"><h2>🥗 Meal log / low-carb</h2><div class="btns" id="keto"></div><div class="strip" id="strip"></div></div>
<div class="card"><h2>💧 Water <span id="wc" style="color:var(--m);font-size:.85rem"></span></h2><div class="drops" id="drops"></div></div>
<div class="card"><h2>⌚ WHOOP</h2><div class="w" id="whoop"></div><div id="wn" style="color:#8a909c;margin-top:6px"></div></div>
<div class="card" id="notes" hidden></div>
</main><script>
const STACK={"Morning (~8 AM)":[["asp","Bayer aspirin 81 mg"],["cre","Thorne creatine 10 g in water"],["cit","Citrucel, 2 caplets"]],
"First meal (~1 PM)":[["omg","Nordic Omega-D3 Sport, 2 softgels"],["qun","Qunol Mega Ubiquinol 100 mg, 1 softgel"],["cen","Centrum Silver, 1 tablet"],["mct","MCT oil ½–1 tsp with food"]],
"Bedtime":[["mag","Doctor's Best magnesium 200 mg (2 tablets)"],["ator","Atorvastatin 80 mg"]]};
function skipped(id,d){return undefined;}
const etDate=(()=>{const n=new Date(),p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(n).map(x=>[x.type,x.value]));let d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));if(+p.hour*60+ +p.minute<510)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);})(); // day rolls over at 8:30 AM ET
const LS=k=>JSON.parse(localStorage.getItem(k)||"null"),SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
fetch("data.json?"+Date.now()).then(r=>r.json()).then(D=>{
const day=etDate;document.getElementById("hd").textContent="Douglas · "+new Date(day+"T12:00").toDateString();
document.getElementById("ch").innerHTML=(D.date!=day?"<i>(Challenge from "+D.date+"; today's not posted yet)</i><br>":"")+D.challenge;
const its=D.date==day?(D.items||[]):[],wk="work:"+day,ws=LS(wk)||{};
document.getElementById("items").innerHTML=its.length?"<div style='margin-top:10px'><b>Checklist</b></div>"+its.map((t,i)=>`<label><input type=checkbox data-i=${i} ${ws[i]?"checked":""}> ${t}</label>`).join(""):"";
function wsr(){const H=LS("workhist")||{};if(its.length)H[day]=its.some((t,i)=>ws[i]&&!/optional/i.test(t))||its.every((t,i)=>ws[i])?(its.every((t,i)=>ws[i]||/optional/i.test(t))?"on":"fast"):"";SS("workhist",H);
let s="";for(let i=6;i>=0;i--){const dt=new Date(day+"T12:00");dt.setDate(dt.getDate()-i);const k=dt.toLocaleDateString("en-CA");s+=`<div class="${H[k]||""}">${dt.toLocaleDateString("en-US",{weekday:"short"})}<br>${H[k]=="on"?"✓":H[k]=="fast"?"½":"·"}</div>`;}
document.getElementById("wstrip").innerHTML=its.length?s:"";}
document.getElementById("items").onchange=e=>{ws[e.target.dataset.i]=e.target.checked;SS(wk,ws);wsr();score()};wsr();
const c=document.getElementById("cons");D.constraint?c.textContent=D.constraint:c.remove();
const sk="stack:"+day,st=LS(sk)||{};let h="";
for(const[g,items]of Object.entries(STACK)){h+="<b>"+g+"</b>";for(const[id,n]of items){const s=skipped(id,day);
h+=s?`<label class="skip">${n} — ${s}</label>`:`<label><input type=checkbox data-id=${id} ${st[id]?"checked":""}> ${n}</label>`;}}
const se=document.getElementById("stack");se.innerHTML=h;se.onchange=e=>{st[e.target.dataset.id]=e.target.checked;SS(sk,st);score()};
const kl=Object.assign({},D.keto_seed||{},LS("keto")||{});
function rk(){const opts=[["on","On plan"],["off","Went off"],["fast","Skipped / fasting"]];
document.getElementById("keto").innerHTML=opts.map(([v,t])=>`<button data-v=${v} class="${kl[day]==v?"sel":""}">${t}</button>`).join("");
let s="";for(let i=6;i>=0;i--){const dt=new Date(day+"T12:00");dt.setDate(dt.getDate()-i);const k=dt.toLocaleDateString("en-CA");
s+=`<div class="${kl[k]||""}">${dt.toLocaleDateString("en-US",{weekday:"short"})}<br>${kl[k]=="on"?"✓":kl[k]=="off"?"✗":kl[k]=="fast"?"–":"·"}</div>`;}
document.getElementById("strip").innerHTML=s;}
document.getElementById("keto").onclick=e=>{const v=e.target.dataset.v;if(!v)return;kl[day]=v;const s=LS("keto")||{};s[day]=v;SS("keto",s);rk();score()};rk();
const W=D.whoop||{},f=(v,u)=>v==null?"<span style='color:#8a909c'>—</span>":v+u;
document.getElementById("whoop").innerHTML=
`<div>Recovery<div class=big>${f(W.recovery,"%")}</div></div><div>Sleep<div class=big>${f(W.sleep,"%")}</div></div><div>Strain<div class=big>${f(W.strain,"")}</div></div>`;
if(W.recovery==null&&W.sleep==null&&W.strain==null)document.getElementById("wn").textContent="No WHOOP data today";
if(D.notes){const n=document.getElementById("notes");n.hidden=false;n.textContent=D.notes;}

const wak="water",WA=LS(wak)||{};let wn=WA[day]||0;const DROP='<svg viewBox="0 0 24 32"><path d="M12 2C12 2 3 14 3 20.5a9 9 0 0 0 18 0C21 14 12 2 12 2z"/></svg>';
function rw(){document.getElementById("drops").innerHTML=Array.from({length:8},(_,i)=>`<button aria-label="Glass ${i+1}" data-i="${i}" class="${i<wn?"f":""}">${DROP}</button>`).join("");document.getElementById("wc").textContent=wn+"/8";}
document.getElementById("drops").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;wn=i<wn?i:i+1;WA[day]=wn;SS(wak,WA);rw();score()};rw();
function score(){
  // Workout 35
  const req=its.map((t,i)=>({t,i})).filter(x=>!/optional/i.test(x.t));
  let w=0;if(req.length){const done=req.filter(x=>ws[x.i]).length;w=Math.round(35*done/req.length);}
  // Stack 25 — split evenly across groups; skipped items don't count
  let stPts=0;const parts=[];
  for(const[g,items]of Object.entries(STACK)){
    const need=items.filter(([id])=>!skipped(id,day));
    const ok=need.length&&need.every(([id])=>st[id]);
    if(ok)stPts+=10;
    parts.push([g.split(" ")[0],ok?10:0]);
  }
  // Keto 20
  const kv=kl[day];const k=(kv==="on"||kv==="fast")?20:0;
  // WHOOP 10 — recovery present for today's data.json
  const wh=(D.date===day&&W.recovery!=null)?10:0;
  stPts=Math.round(25*stPts/(10*Object.keys(STACK).length));
  const wa=Math.round(10*wn/8);
  const tot=w+stPts+k+wa+wh;
  document.getElementById("sc").textContent=tot;
  document.getElementById("sb").textContent=
    `Workout ${w}/35 · Stack ${stPts}/25 · Meals ${k}/20 · Water ${wa}/10 · WHOOP ${wh}/10`;
  const SH=LS("scorehist")||{};SH[day]=tot;SS("scorehist",SH);
  let s="";for(let i=6;i>=0;i--){const dt=new Date(day+"T12:00");dt.setDate(dt.getDate()-i);const dk=dt.toLocaleDateString("en-CA");
    const v=SH[dk];let cls="";if(v!=null){cls=v>=70?"hi":v>=40?"md":"lo";}
    s+=`<div class="${cls}">${dt.toLocaleDateString("en-US",{weekday:"short"})}<br>${v!=null?v:"·"}</div>`;}
  document.getElementById("sstrip").innerHTML=s;
}
score();
});
</script></body></html>
